<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaicos · prototipo digital</title>
<style>
:root{--bg:#12151b;--pn:#1c2029;--tx:#ece8df;--mu:#8e93a0;--ac:#e8c07a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Georgia,serif;display:flex;flex-wrap:wrap;gap:18px;padding:18px;justify-content:center;align-items:flex-start}
canvas{background:#0c0e13;border-radius:14px;max-width:100%;height:auto;cursor:pointer;touch-action:manipulation}
aside{width:290px;background:var(--pn);border-radius:14px;padding:18px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
p{color:var(--mu);font:13px/1.4 system-ui,sans-serif;margin:0 0 14px}
.t{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
button{background:#272b37;color:var(--tx);border:1px solid #394050;border-radius:8px;padding:8px 6px;font:13px system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac)}
button.on{border-color:var(--ac);background:#3a3427}
.b{margin:9px 0;font:13px system-ui,sans-serif}
.b span{display:flex;justify-content:space-between}
.b i{display:block;height:8px;border-radius:4px;background:#272b37;margin-top:4px;overflow:hidden}
.b i b{display:block;height:100%;width:50%;transition:width .6s}
#bien{font-size:34px;text-align:center;margin:12px 0 2px}
#dia{text-align:center;color:var(--mu);font:13px system-ui,sans-serif;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.b i b{transition:none}}
</style></head><body>
<canvas id="c" width="600" height="540" aria-label="Mapa hexagonal de la ciudad"></canvas>
<aside>
<h1>Mosaicos</h1>
<p>Elige una ficha y haz clic en un hexágono. Clic derecho o «Borrar» para quitarla. Importa cuántas fichas hay más que dónde.</p>
<div class="t" id="tools"></div>
<div id="bien">😊</div><div id="dia">Día 1</div>
<div id="bars"></div>
<button id="reset" style="width:100%;margin-top:12px">Reiniciar ciudad</button>
</aside>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=600,H=540,S=44,CX=W/2,CY=H/2;
const D=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const T={V:{n:'Vivienda',e:'🏠',c:'#e8c07a'},I:{n:'Industria',e:'🏭',c:'#9aa0ae'},G:{n:'Área verde',e:'🌳',c:'#5fbf7a'},C:{n:'Centro (3 hex)',e:'💧',c:'#5aa9e6'}};
const VARS=[['pop','Población / densidad','#e8c07a'],['emp','Empleo / economía','#b59cf0'],['cont','Contaminación','#c66a5a'],['ver','Áreas verdes','#5fbf7a'],['rec','Recursos','#5aa9e6'],['bien','Bienestar','#f0d36a']];
const K=(q,r)=>q+','+r,ok=(q,r)=>Math.abs(q)<=3&&Math.abs(r)<=3&&Math.abs(q+r)<=3;
const px=(q,r)=>[CX+S*Math.sqrt(3)*(q+r/2),CY+S*1.5*r];
const cl=v=>Math.max(0,Math.min(100,v)),lp=(a,b,t)=>a+(b-a)*t;
const ALL=[];for(let q=-3;q<=3;q++)for(let r=-3;r<=3;r++)if(ok(q,r))ALL.push([q,r]);
let cells,gid,s,sel='V',day=1,lastTau=0;
const dots=Array.from({length:100},()=>({a:Math.random(),b:Math.random(),r:Math.random()}));

function rm(q,r){const c=cells.get(K(q,r));if(!c)return;
 if(c.t==='C'){for(const [k,v] of [...cells])if(v.g===c.g)cells.delete(k)}else cells.delete(K(q,r))}
function place(q,r,t){if(!ok(q,r))return;
 if(t==='X'){rm(q,r);return}
 rm(q,r);
 if(t==='C'){for(let i=0;i<6;i++){const a=D[i],b=D[(i+1)%6],cs=[[q,r],[q+a[0],r+a[1]],[q+b[0],r+b[1]]];
  if(cs.every(([u,v])=>ok(u,v)&&!cells.has(K(u,v)))){gid++;cs.forEach(([u,v])=>cells.set(K(u,v),{q:u,r:v,t:'C',g:gid}));return}}
  flash=20;return}
 cells.set(K(q,r),{q,r,t,g:0})}
let flash=0;
function reset(){cells=new Map();gid=0;
 s={pop:38,emp:28,cont:8,ver:35,rec:58,bien:60};
 place(0,0,'C');place(-2,0,'V');place(-2,1,'V');place(2,0,'I');place(0,2,'G');day=1}
const cnt=t=>[...cells.values()].filter(c=>c.t===t).length;
function tick(){const V=cnt('V'),I=cnt('I'),G=cnt('G'),C=cnt('C')/3;
 let popT=V?cl(20+9*V+.25*(s.emp-50)-.3*Math.max(0,s.cont-60)-Math.max(0,30-s.bien)):0;
 let empT=I?cl(15+11*I):0;if(s.rec<25)empT*=.6;
 const contT=cl(5+12*I+.1*s.pop-9*G-6*C),verT=cl(40+8*G-6*V-.4*s.cont),recT=cl(60+15*C-5*I-.3*s.pop);
 s.pop=lp(s.pop,popT,.15);s.emp=lp(s.emp,empT,.15);s.cont=lp(s.cont,contT,.15);s.ver=lp(s.ver,verT,.15);s.rec=lp(s.rec,recT,.15);
 const match=s.pop<1?60:100-Math.min(100,Math.abs(s.pop-s.emp)*1.5);
 s.bien=cl((100-s.cont)*.3+s.ver*.2+s.rec*.2+match*.3);
 ui()}
function ui(){for(const [k] of VARS){document.getElementById('b_'+k).style.width=s[k].toFixed(0)+'%';document.getElementById('v_'+k).textContent=s[k].toFixed(0)}
 document.getElementById('bien').textContent=s.bien>60?'😊':s.bien>35?'😐':'😟';
 document.getElementById('dia').textContent='Día '+day}
// UI build
document.getElementById('tools').innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}">${v.e} ${v.n}</button>`).join('')+'<button data-t="X">✖ Borrar</button>';
document.getElementById('bars').innerHTML=VARS.map(([k,n,c])=>`<div class="b"><span>${n}<em id="v_${k}" style="font-style:normal"></em></span><i><b id="b_${k}" style="background:${c}"></b></i></div>`).join('');
const tb=[...document.querySelectorAll('#tools button')];
function pick(t){sel=t;tb.forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
tb.forEach(b=>b.onclick=()=>pick(b.dataset.t));pick('V');
document.getElementById('reset').onclick=()=>{reset();ui()};

function hexAt(mx,my){const r=cv.getBoundingClientRect(),X=(mx-r.left)*W/r.width-CX,Y=(my-r.top)*H/r.height-CY;
 const fq=(Math.sqrt(3)/3*X-Y/3)/S,fr=(2/3*Y)/S;let q=Math.round(fq),rr=Math.round(fr),sq=Math.round(-fq-fr);
 const dq=Math.abs(q-fq),dr=Math.abs(rr-fr),ds=Math.abs(sq+fq+fr);
 if(dq>dr&&dq>ds)q=-rr-sq;else if(dr>ds)rr=-q-sq;return[q,rr]}
cv.addEventListener('click',e=>{const[q,r]=hexAt(e.clientX,e.clientY);place(q,r,sel)});
cv.addEventListener('contextmenu',e=>{e.preventDefault();const[q,r]=hexAt(e.clientX,e.clientY);place(q,r,'X')});

function hex(cx,cy,r){x.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k+30);x[k?'lineTo':'moveTo'](cx+r*Math.cos(a),cy+r*Math.sin(a))}x.closePath()}
const sm=v=>v*v*(3-2*v),c01=v=>Math.max(0,Math.min(1,v));
function frame(now){
 const tau=(now%24000)/24000;if(tau<lastTau){day++;ui()}lastTau=tau;
 const light=.5+.5*Math.cos(2*Math.PI*(tau-.5)),night=1-light;
 x.clearRect(0,0,W,H);
 const Vl=[],Il=[];
 for(const[q,r]of ALL){const[cx,cy]=px(q,r),c=cells.get(K(q,r)),g=s.ver/100;
  hex(cx,cy,S-2);x.fillStyle=`rgb(${lp(74,47,g)|0},${lp(64,107,g)|0},${lp(48,69,g)|0})`;x.fill();
  x.strokeStyle='#0c0e13';x.lineWidth=2;x.stroke();
  if(c){hex(cx,cy,S-9);x.fillStyle=T[c.t].c;x.globalAlpha=.9;x.fill();x.globalAlpha=1;
   x.font='20px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(T[c.t].e,cx,cy+1);
   if(c.t==='V')Vl.push([cx,cy]);if(c.t==='I')Il.push([cx,cy])}}
 // bruma
 for(const[cx,cy]of Il){const gr=x.createRadialGradient(cx,cy,5,cx,cy,S*2.4);gr.addColorStop(0,`rgba(150,150,150,${s.cont/120})`);gr.addColorStop(1,'rgba(150,150,150,0)');x.fillStyle=gr;x.fillRect(cx-S*3,cy-S*3,S*6,S*6)}
 x.fillStyle=`rgba(130,130,130,${s.cont/320})`;x.fillRect(0,0,W,H);
 // personas
 const n=Vl.length?Math.round(s.pop*.9):0,ef=s.pop<1?0:Math.min(1,s.emp/s.pop);
 const u=sm(c01((tau-.25)/.1))-sm(c01((tau-.6)/.1));
 x.fillStyle='#fff';
 for(let i=0;i<n;i++){const d=dots[i],h=Vl[Math.floor(d.a*Vl.length)];let X=h[0],Y=h[1];
  if(Il.length&&d.r<ef){const w=Il[Math.floor(d.b*Il.length)];X=lp(h[0],w[0],u)+Math.sin(i)*8;Y=lp(h[1],w[1],u)+Math.cos(i*2)*8}
  else{const a=now/900+d.b*6.28;X+=Math.cos(a)*14;Y+=Math.sin(a)*14}
  x.globalAlpha=.85;x.beginPath();x.arc(X,Y,2.4,0,7);x.fill()}
 x.globalAlpha=1;
 // día y noche
 x.fillStyle=`rgba(255,196,120,${.1*light})`;x.fillRect(0,0,W,H);
 x.fillStyle=`rgba(14,30,100,${.55*night})`;x.fillRect(0,0,W,H);
 if(night>.3){x.globalCompositeOperation='lighter';for(const[cx,cy]of Vl){const gr=x.createRadialGradient(cx,cy,2,cx,cy,S*.9);gr.addColorStop(0,`rgba(255,210,120,${night*.7})`);gr.addColorStop(1,'rgba(255,210,120,0)');x.fillStyle=gr;x.fillRect(cx-S,cy-S,S*2,S*2)}x.globalCompositeOperation='source-over'}
 if(flash>0){flash--;x.fillStyle='#ece8df';x.font='14px system-ui';x.textAlign='center';x.fillText('No cabe el centro: necesita 3 hexágonos libres juntos',CX,H-14)}
 requestAnimationFrame(frame)}
reset();ui();setInterval(tick,1200);requestAnimationFrame(frame);
</script></body></html>
